name: Postgres Backend

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.11
  # Two databases, because both Postgres suites drop and recreate `public` and
  # would trash each other if `bun test` ever stopped running files serially.
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/datamog_test
  DATAMOG_EXAMPLES_DATABASE_URL: postgres://postgres:postgres@localhost:5432/datamog_examples
  # In this workflow a skipped Postgres suite is a failure, not a no-op. Both
  # suites gate on `DATABASE_URL`, so a broken container or a typo'd URL would
  # otherwise turn ~100 tests into zero and still report green — which is how they
  # went stale for a whole branch once. `require-postgres.test.ts` reads this and
  # fails instead. Not keyed on `CI`, because ci.yml's Quality Gate runs the same
  # `bun test` with no database and must stay green.
  DATAMOG_REQUIRE_POSTGRES: "1"

jobs:
  postgres:
    name: Postgres Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: datamog_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d datamog_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      # The service container creates only `POSTGRES_DB`. `psql` is preinstalled
      # on the GitHub-hosted Ubuntu images.
      - name: Create the examples database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d datamog_test -c 'CREATE DATABASE datamog_examples'

      # The whole suite, not just the Postgres backend's own file. Both
      # `DATABASE_URL`-gated blocks then run, and a new one is covered without
      # anyone remembering to add it here; that drift is why the examples suite,
      # which is the cross-backend differential one, went unrun in CI for so long.
      - run: bun run test
