name: Lean Verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/datamog_lean
      DATAMOG_REQUIRE_POSTGRES: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: datamog_lean
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d datamog_lean"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Install the pinned Lean toolchain
        run: |
          curl -fsSL https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: bun run test:lean --require-goal Ordered_coverage --require-goal Ordered_soundness --require-goal orderedTotal_refuted --require-goal BothPositive_coverage --require-goal BothPositive_soundness --require-goal bothPositiveSecond_refuted --require-goal Ranged_coverage --require-goal Ranged_soundness --require-goal rangedUpper_refuted --require-goal Positive_coverage --require-goal Positive_soundness --require-goal positiveTotal_refuted --require-goal Excluded_coverage --require-goal Excluded_soundness --require-goal excludedTotal_refuted --require-goal Filtered_coverage --require-goal Filtered_soundness --require-goal filteredTotal_refuted --require-goal successor --require-goal falseGoal_refuted --require-goal reachTransitive --require-goal identityUnique --require-goal reachUnique_refuted --require-goal successorCoverage --require-goal successorTotal_refuted --require-goal guardedCoverage --require-goal guardedTotal_refuted --require-goal saturatingCoverage --require-goal saturatingUnique --require-goal overlappingUnique_refuted --require-goal diagonalUnique --require-goal diagonalTotal_refuted --require-goal recordAbsent --require-goal recordLastWrite --require-goal recordNullDistinct --require-goal requiredFieldPresent --require-goal nonnullableFieldInteger --require-goal optionalFieldTotal_refuted --require-goal DocumentSchema_field0 --require-goal DocumentSchema_field1 --require-goal schemaFieldMatches --require-goal schemaClosed --require-goal emptySchemaExact --require-goal nestedRequiredPath --require-goal NestedSchema_path0 --require-goal NestedSchema_path1 --require-goal optionalParentTotal_refuted --require-goal nullableParentTotal_refuted --require-goal IntegerArray_lookup --require-goal NullableIntegerArray_lookup --require-goal arrayElementValid --require-goal arrayNegativeAbsent --require-goal arrayPastEndAbsent --require-goal arrayTotal_refuted --require-goal NestedArray_lookup --require-goal NullableNestedArray_lookup --require-goal DeepArray_lookup --require-goal nestedArrayTypedLookup --require-goal nestedArrayTotal_refuted --require-goal structuralRequiredLookup --require-goal MixedSchema_path0 --require-goal MixedSchema_path1 --require-goal MixedArraySchema_path0 --require-goal mixedEmptyTotal_refuted --require-goal mixedOptionalTotal_refuted --require-goal mixedNullTotal_refuted --require-goal FirstAge_coverage --require-goal FirstRating_coverage --require-goal firstAgeTotal_refuted --require-goal structuralTypedLookup --require-goal FirstAge_soundness --require-goal FirstRating_soundness --require-goal ProfileAge_soundness --require-goal ProfileRating_soundness --require-goal OptionalAge_soundness --require-goal OptionalRating_soundness --require-goal optionalProfileTotal_refuted --require-goal nullableProfileTotal_refuted --require-goal DynamicAge_coverage --require-goal DynamicAge_soundness --require-goal DynamicRating_coverage --require-goal DynamicRating_soundness --require-goal ReusedAge_coverage --require-goal ReusedAge_soundness --require-goal DynamicScore_soundness --require-goal dynamicTotal_refuted --require-goal Paired_coverage --require-goal Paired_soundness --require-goal OptionalPair_soundness --require-goal RepeatedPair_coverage --require-goal RepeatedPair_soundness --require-goal pairedSameRow --require-goal pairedFirstBounds_refuted --require-goal optionalPairTotal_refuted --require-goal Identified_coverage --require-goal Identified_soundness --require-goal Indexed_coverage --require-goal Indexed_soundness --require-goal OptionalIdentified_soundness --require-goal identifiedSameRow --require-goal identifiedTotal_refuted

      - run: bun run test:lean-project
